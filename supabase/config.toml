project_id = "food-briefing"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[storage]
enabled = true
# 정적 프론트(index.html)를 담을 버킷. 512KB 남짓이라 기본 제한으로 충분.
file_size_limit = "5MiB"

[storage.buckets.app]
public = true
file_size_limit = "5MiB"
objects_path = "../web"

[functions.api]
# 프론트가 접속 암호(APP_PASSWORD)로 자체 인증하므로 Supabase JWT 검사는 끈다.
# 켜두면 anon 키를 프론트에 노출해야 하고, 그래도 누구나 쓸 수 있어 의미가 없다.
verify_jwt = false
